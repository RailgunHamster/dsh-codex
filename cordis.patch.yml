# dsh-codex bundle patch: mount the split-routing proxy host plugin.
# The row `config` here is the bundle layer; the profile's cordis.patch.yml
# `codex` entry overrides it. Edits made in the DSH settings UI are written to
# that profile entry and apply immediately (the Config is volatile).
- insert:
    - id: codex
      name: 'dsh-codex'
      config:
        enabled: true
        upstream: 'http://127.0.0.1:7890'
        hosts: ['chatgpt.com', 'auth.openai.com']
